<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OficioRed - Gestión de Transacciones</title>
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>

    <!-- Sidebar -->
    <aside class="sidebar">
        <h2>OficioRed</h2>
        <a href="categorias.html">Categorías</a>
        <a href="usuarios.html">Usuarios</a>
        <a href="profesionales.html">Profesionales</a>
        <a href="servicios.html">Servicios</a>
        <a href="transacciones.html" class="active">Transacciones</a>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <div class="header-actions">
            <h1>Gestión de Transacciones</h1>
            <button class="btn btn-primary" onclick="openModal()">+ Nueva Transacción</button>
        </div>

        <div class="card">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Cliente</th>
                        <th>Servicio</th>
                        <th>Profesional</th>
                        <th>Estado</th>
                        <th>Monto Acordado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    <!-- Filas generadas dinámicamente -->
                </tbody>
            </table>
        </div>
    </main>

    <!-- Modal Formulario -->
    <div class="modal-overlay" id="modal">
        <div class="modal-content" style="max-width: 600px;">
            <div class="modal-header">
                <h3 id="modal-title">Nueva Transacción</h3>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <form id="transaccion-form">
                <input type="hidden" id="id_transaccion">
                
                <div class="form-group" id="cliente-group">
                    <label for="id_usuario">Cliente</label>
                    <select id="id_usuario" class="form-control" required>
                        <option value="">Seleccione...</option>
                    </select>
                </div>
                
                <div class="form-group" id="servicio-group">
                    <label for="id_servicio_ofrecido">Servicio Solicitado</label>
                    <select id="id_servicio_ofrecido" class="form-control" required>
                        <option value="">Seleccione...</option>
                    </select>
                </div>

                <div style="display: flex; gap: 1rem;">
                    <div class="form-group" style="flex: 1;">
                        <label for="estado">Estado</label>
                        <select id="estado" class="form-control" required>
                            <option value="pendiente">Pendiente</option>
                            <option value="aceptado">Aceptado</option>
                            <option value="en_proceso">En Proceso</option>
                            <option value="finalizado">Finalizado</option>
                            <option value="cancelado">Cancelado</option>
                        </select>
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label for="monto_acordado">Monto Acordado ($)</label>
                        <input type="number" step="0.01" id="monto_acordado" class="form-control" required min="0" value="0.00">
                    </div>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%;">Guardar Transacción</button>
            </form>
        </div>
    </div>

    <div id="toast-container"></div>
    <script src="assets/js/transacciones.js"></script>
</body>
</html>
